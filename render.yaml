# Render blueprint — provisions the whole backend stack in one go.
# In Render: New → Blueprint → point at the jobcatch-backend repo.
databases:
  - name: jobcatch-db
    databaseName: jobcatch
    user: jobcatch
    plan: free            # 90-day expiry on free; upgrade to starter for production
    postgresMajorVersion: "16"

services:
  # --- Redis: Channels layer (chat) + Celery broker ---
  - type: keyvalue
    name: jobcatch-redis
    plan: free
    ipAllowList: []       # internal access only
    maxmemoryPolicy: noeviction

  # --- Django API (ASGI: WebSockets need uvicorn, not gunicorn) ---
  - type: web
    name: jobcatch-api
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz/
    # Uploads (photos, CVs, videos, verification docs) must outlive a deploy.
    # Without this disk, Render's filesystem is wiped on every build.
    disk:
      name: jobcatch-media
      mountPath: /var/media
      sizeGB: 5
    envVars:
      - key: RENDER_DISK_PATH
        value: /var/media
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong value
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: jobcatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jobcatch-redis
          property: connectionString
      # --- set these in the Render dashboard (secrets / domain-specific) ---
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYMENT_CALLBACK_URL
        sync: false
      # --- Phase 2 (see PHASE5_SETUP.md) ---
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: DEFAULT_PAYMENT_GATEWAY
        value: paystack
      - key: BILLING_GATEWAY
        value: flutterwave
      - key: BILL_BETTING_ENABLED
        value: "True"
      - key: FRONTEND_URL
        value: https://jobcatchonline.com
      - key: PAID_JOB_LISTINGS_ENABLED
        value: "True"
      - key: KYC_REQUIRED_TO_POST_JOBS
        value: "True"
      - key: KYC_AUTO_APPROVE
        value: "False"
      - key: KYC_PROVIDER
        value: manual
      - key: DOJAH_APP_ID
        sync: false
      - key: DOJAH_SECRET_KEY
        sync: false
      - key: SMS_BACKEND
        value: termii
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: WHATSAPP_BACKEND
        value: console
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: VTU_USERNAME
        sync: false
      - key: VTU_PASSWORD
        sync: false
      - key: VTU_USER_PIN
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false

  # --- Scheduled housekeeping: listing/plan expiry, payment reconciliation,
  # bill requery + refunds, renewal reminders, upgrade nudges. Every 15 min.
  # Render cron jobs can't mount the web service's disk, which is fine: no
  # step here touches uploaded files. Copy the web service's env vars
  # (DATABASE_URL, SECRET_KEY, gateway + VTU keys) into this job too.
  - type: cron
    name: jobcatch-scheduler
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_scheduled_tasks"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: DATABASE_URL
        fromDatabase:
          name: jobcatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jobcatch-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: BILLING_GATEWAY
        value: flutterwave
      - key: VTU_USERNAME
        sync: false
      - key: VTU_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
